  # ===== TASK ASSIGNMENT APIs =====

  /api/syllabus/versions/assignments/student:
    post:
      summary: Auto-assign all tasks of a syllabus version to a single student
      description: Assigns all active tasks from the given syllabus version to the student. If tasks already exist, they are updated. Manual assignments are preserved.
      tags:
        - Task Assignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentId
              properties:
                studentId:
                  type: string
                  description: Student ID to assign tasks to
                  example: "64fdb61e7b9a1a1234567890"
                syllabusVersionId:
                  type: string
                  description: Optional - if not provided, student's current syllabusVersionId is used
                  example: "64fdb61e7b9a1a1234567895"
      responses:
        '200':
          description: Tasks assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tasks assigned to student successfully"
                  data:
                    type: object
                    properties:
                      studentId:
                        type: string
                      syllabusVersionId:
                        type: string
                      createdCount:
                        type: integer
                        example: 10
                      updatedCount:
                        type: integer
                        example: 2
                      totalTasks:
                        type: integer
                        example: 12
        '400':
          description: Validation error (student not found, version mismatch, no tasks)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "No active tasks found in syllabus"

  /api/syllabus/versions/assignments/bulk:
    post:
      summary: Auto-assign tasks to multiple students
      description: Assigns all active tasks from the syllabus version to each student in the list. Processes each student independently.
      tags:
        - Task Assignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentIds
              properties:
                studentIds:
                  type: array
                  items:
                    type: string
                  description: Array of student IDs
                  example: ["64fdb61e7b9a1a1234567890", "64fdb61e7b9a1a1234567891"]
                syllabusVersionId:
                  type: string
                  description: Optional - if not provided, each student's own syllabusVersionId is used
                  example: "64fdb61e7b9a1a1234567895"
      responses:
        '200':
          description: Bulk assignment result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tasks assigned: 2 succeeded, 0 failed"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        success:
                          type: boolean
                        studentId:
                          type: string
                        createdCount:
                          type: integer
                        updatedCount:
                          type: integer
                        totalTasks:
                          type: integer
                        message:
                          type: string
                          description: Present only if success is false
        '400':
          description: studentIds must be a non-empty array

  /api/syllabus/versions/assignments/manual:
    post:
      summary: Manually assign selected tasks to selected students
      description: Assigns specific tasks (by taskIds) to specific students (by studentIds). Marks assignment as 'manual'. Existing tasks are updated, new ones are created.
      tags:
        - Task Assignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - studentIds
                - taskIds
              properties:
                studentIds:
                  type: array
                  items:
                    type: string
                  description: Array of student IDs to assign tasks to
                  example: ["64fdb61e7b9a1a1234567890", "64fdb61e7b9a1a1234567891"]
                taskIds:
                  type: array
                  items:
                    type: string
                  description: Array of task IDs to assign
                  example: ["64fdb61e7b9a1a1234567896", "64fdb61e7b9a1a1234567897"]
                syllabusVersionId:
                  type: string
                  description: Optional - if not provided, each student's own syllabusVersionId is used
                  example: "64fdb61e7b9a1a1234567895"
      responses:
        '200':
          description: Manual assignment result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Manual task assignment completed: 2 succeeded, 0 failed"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        success:
                          type: boolean
                        studentId:
                          type: string
                        syllabusVersionId:
                          type: string
                        createdCount:
                          type: integer
                        updatedCount:
                          type: integer
                        totalTasks:
                          type: integer
                        message:
                          type: string
                          description: Present only if success is false
        '400':
          description: Validation error

  /api/syllabus/versions/assignments/session-level:
    post:
      summary: Auto-assign tasks to all students in a session/level/sublevel
      description: Finds all active students matching the given session, level, and sublevel filters, then assigns tasks to all of them.
      tags:
        - Task Assignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - syllabusVersionId
              properties:
                sessionId:
                  type: string
                  description: Optional filter by session
                  example: "64fdb61e7b9a1a1234567894"
                levelId:
                  type: string
                  description: Optional filter by level
                  example: "64fdb61e7b9a1a1234567892"
                subLevelId:
                  type: string
                  description: Optional filter by sub-level
                  example: "64fdb61e7b9a1a1234567893"
                syllabusVersionId:
                  type: string
                  description: Syllabus version to assign tasks from
                  example: "64fdb61e7b9a1a1234567895"
      responses:
        '200':
          description: Assignment result for all matched students
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tasks assigned to 15 students"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        success:
                          type: boolean
                        studentId:
                          type: string
                        createdCount:
                          type: integer
                        totalTasks:
                          type: integer
        '400':
          description: Validation error

  # ===== TASK STATUS UPDATE API =====

  /api/syllabus/versions/students/{studentId}/tasks/{taskId}:
    patch:
      summary: Update student task status and marks
      description: |
        Updates the status and/or marks of a specific task for a student.
        - When status is set to `inProgress`, `startedAt` is recorded automatically.
        - When status is set to `completed`, marks are required and `completedAt` is recorded.
        - Changing status away from `completed` clears marks automatically.
        - After every update, a progress snapshot and task history entry are created.
        - Student readiness status is auto-synced after update.
      tags:
        - Task Assignment
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
          description: Student ID
          example: "64fdb61e7b9a1a1234567890"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID (the master task ID, not StudentTask _id)
          example: "64fdb61e7b9a1a1234567896"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, inProgress, completed]
                  description: New status for the task
                  example: "completed"
                marks:
                  type: number
                  minimum: 0
                  maximum: 5
                  description: Required when status is completed (0-5)
                  example: 4
                notes:
                  type: string
                  description: Optional notes about the task
                  example: "Student completed with good understanding"
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                      studentId:
                        type: string
                      taskId:
                        type: string
                      title:
                        type: string
                        example: "Build a REST API"
                      status:
                        type: string
                        example: "completed"
                      marks:
                        type: number
                        example: 4
                      maxMarks:
                        type: number
                        example: 5
                      notes:
                        type: string
                      startedAt:
                        type: string
                        format: date-time
                      completedAt:
                        type: string
                        format: date-time
        '400':
          description: Validation error (marks required for completed, marks exceed maxMarks, task not found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Marks are required when task status is completed"
        '500':
          description: Server error

  /api/students/{id}/tasks:
    get:
      summary: Get all tasks of a student grouped by subject
      tags:
        - Student Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: subLevelId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, inProgress, completed]
      responses:
        '200':
          description: Student tasks grouped by subject
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalTasks:
                    type: integer
                    example: 30
                  completedTasks:
                    type: integer
                    example: 15
                  pendingTasks:
                    type: integer
                    example: 10
                  inProgressTasks:
                    type: integer
                    example: 5
                  groupedBySubject:
                    type: object
        '404':
          description: Student not found
        '500':
          description: Server error

  /api/students/{id}/tasks/sublevel/{subLevelId}:
    get:
      summary: Get student tasks for a specific sub-level with stats
      tags:
        - Student Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: subLevelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tasks for the sub-level with stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 10
                      completed:
                        type: integer
                        example: 6
                      pending:
                        type: integer
                        example: 3
                      inProgress:
                        type: integer
                        example: 1
                      averageMarks:
                        type: number
                        example: 3.8
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        title:
                          type: string
                        subjectName:
                          type: string
                        topicName:
                          type: string
                        status:
                          type: string
                          enum: [pending, inProgress, completed]
                        marks:
                          type: number
                          nullable: true
                        maxMarks:
                          type: number
                          example: 5
        '404':
          description: Student not found
        '500':
          description: Server error

  /api/students/{id}/task-history:
    get:
      summary: Get student task change history with pagination
      tags:
        - Student History
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: query
          schema:
            type: string
        - name: subLevelId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Task history with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 45
                  page:
                    type: integer
                    example: 1
                  totalPages:
                    type: integer
                    example: 3
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        taskTitle:
                          type: string
                        status:
                          type: string
                          enum: [pending, inProgress, completed]
                        marks:
                          type: number
                          nullable: true
                        subLevelName:
                          type: string
                        changedByName:
                          type: string
                        changedAt:
                          type: string
                          format: date-time
        '500':
          description: Server error

  # ===== SYLLABUS VERSION APIs =====

  /api/syllabus/versions:
    post:
      summary: Create a new syllabus version
      description: Creates a new syllabus version with subjects, topics, subtopics. Status defaults to 'draft'.
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sessionId
                - levelId
                - subLevelId
                - version
                - subjects
              properties:
                sessionId:
                  type: string
                  example: "64fdb61e7b9a1a1234567894"
                levelId:
                  type: string
                  example: "64fdb61e7b9a1a1234567892"
                subLevelId:
                  type: string
                  example: "64fdb61e7b9a1a1234567893"
                version:
                  type: string
                  example: "v1"
                title:
                  type: string
                  example: "BCA Level 1A Syllabus"
                subjects:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        example: "JavaScript"
                      code:
                        type: string
                        example: "JS101"
                      topics:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "Functions"
                            subTopics:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    example: "Arrow Functions"
      responses:
        '201':
          description: Syllabus version created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Syllabus version created successfully"
                  data:
                    type: object
        '400':
          description: Validation error or duplicate version
        '401':
          description: Unauthorized
        '500':
          description: Server error

    get:
      summary: Get all syllabus versions
      description: Returns all active syllabus versions. Supports optional filters.
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: query
          schema:
            type: string
          example: "64fdb61e7b9a1a1234567894"
        - name: levelId
          in: query
          schema:
            type: string
          example: "64fdb61e7b9a1a1234567892"
        - name: subLevelId
          in: query
          schema:
            type: string
          example: "64fdb61e7b9a1a1234567893"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, archived]
      responses:
        '200':
          description: List of syllabus versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 5
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Server error

  /api/syllabus/versions/sublevel/{subLevelId}:
    get:
      summary: Get syllabus versions by subLevel
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      parameters:
        - name: subLevelId
          in: path
          required: true
          schema:
            type: string
          example: "64fdb61e7b9a1a1234567893"
        - name: sessionId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Syllabus versions for the subLevel
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '500':
          description: Server error

  /api/syllabus/versions/{id}:
    get:
      summary: Get syllabus version by ID
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Syllabus version found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
        '404':
          description: Syllabus version not found
        '500':
          description: Server error

    patch:
      summary: Update a draft syllabus version
      description: Only syllabus versions with status 'draft' can be updated directly.
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Updated Syllabus Title"
                subjects:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Draft syllabus updated successfully
        '400':
          description: Only draft syllabus versions can be updated
        '404':
          description: Syllabus version not found
        '500':
          description: Server error

    delete:
      summary: Delete (soft delete) a syllabus version
      description: Only non-active syllabus versions can be deleted.
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted successfully
        '400':
          description: Cannot delete active syllabus
        '404':
          description: Not found
        '500':
          description: Server error

  /api/syllabus/versions/{id}/activate:
    patch:
      summary: Activate a syllabus version
      description: Activates the syllabus version and archives any previously active version for the same session/level/sublevel.
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Syllabus version activated successfully
        '404':
          description: Syllabus version not found
        '500':
          description: Server error

  /api/syllabus/versions/{id}/archive:
    patch:
      summary: Archive a syllabus version
      tags:
        - Syllabus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Syllabus version archived successfully
        '404':
          description: Syllabus version not found
        '500':
          description: Server error

