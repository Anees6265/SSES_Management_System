  # ===== TASK APIs (Syllabus Tasks) =====

  /api/syllabus/versions/{id}/tasks:
    get:
      summary: Get all tasks of a syllabus version
      description: Returns all active tasks. Supports optional filters by subjectId, topicId, subTopicId.
      tags:
        - Syllabus Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Syllabus version ID
        - name: subjectId
          in: query
          schema:
            type: string
        - name: topicId
          in: query
          schema:
            type: string
        - name: subTopicId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        title:
                          type: string
                          example: "Build a REST API"
                        subjectName:
                          type: string
                          example: "Node.js"
                        topicName:
                          type: string
                          example: "Express"
                        type:
                          type: string
                          enum: [assignment, project, quiz, reading, practice]
                        mandatory:
                          type: boolean
                        maxMarks:
                          type: number
                          example: 5
                        timeDays:
                          type: number
                          nullable: true
                        order:
                          type: integer
        '500':
          description: Server error

    post:
      summary: Add a task to a syllabus version
      description: |
        Adds a new task linked to a subject and topic (and optionally a subtopic).
        If the syllabus version is active, the task is auto-synced to all enrolled students.
      tags:
        - Syllabus Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Syllabus version ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subjectId
                - topicId
                - title
              properties:
                subjectId:
                  type: string
                  example: "64fdb61e7b9a1a1234567896"
                topicId:
                  type: string
                  example: "64fdb61e7b9a1a1234567897"
                subTopicId:
                  type: string
                  description: Optional
                  example: "64fdb61e7b9a1a1234567898"
                title:
                  type: string
                  example: "Build a REST API"
                description:
                  type: string
                  example: "Create a CRUD API using Express and MongoDB"
                type:
                  type: string
                  enum: [assignment, project, quiz, reading, practice]
                  default: assignment
                  example: "assignment"
                mandatory:
                  type: boolean
                  default: true
                  example: true
                maxMarks:
                  type: number
                  default: 5
                  example: 5
                timeDays:
                  type: number
                  nullable: true
                  example: 3
                measurablePoints:
                  type: string
                  example: "API should handle all CRUD operations"
      responses:
        '201':
          description: Task added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Task added successfully"
                  data:
                    type: object
                    properties:
                      task:
                        type: object
                      syncedStudents:
                        type: integer
                        description: Number of students synced (if syllabus is active)
                        example: 5
        '400':
          description: subjectId, topicId and title are required
        '404':
          description: Syllabus version or subject/topic not found
        '500':
          description: Server error

  /api/syllabus/versions/{id}/tasks/{taskId}/active:
    patch:
      summary: Toggle task active/inactive
      description: Activates or deactivates a task. If syllabus is active, student tasks are auto-synced.
      tags:
        - Syllabus Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Syllabus version ID
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Task updated"
                  data:
                    type: object
                    properties:
                      task:
                        type: object
                      syncedStudents:
                        type: integer
                        example: 5
        '404':
          description: Task not found
        '500':
          description: Server error

