  # ===== NEW STUDENT APIs (Task-Based System) =====

  /api/students:
    post:
      summary: Create a new student
      description: |
        Creates a new student. The following are auto-resolved — **do NOT send in body**:
        - `sessionId` — latest active session
        - `currentLevelId` — first level (lowest order) of the subDepartment
        - `currentSubLevelId` — first sub-level (lowest order) of that level
        - `syllabusVersionId` — latest active syllabus version for that session/level/sublevel
      tags:
        - Student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prkey
                - firstName
                - lastName
                - fatherName
                - studentMobile
                - parentMobile
                - address
                - village
                - course
                - subDepartmentId
              properties:
                prkey:
                  type: string
                  example: "SS2025001"
                firstName:
                  type: string
                  example: "Rahul"
                lastName:
                  type: string
                  example: "Sharma"
                fatherName:
                  type: string
                  example: "Mahesh Sharma"
                email:
                  type: string
                  example: "rahul@example.com"
                studentMobile:
                  type: string
                  example: "9876543210"
                parentMobile:
                  type: string
                  example: "9876543211"
                gender:
                  type: string
                  example: "Male"
                dob:
                  type: string
                  format: date
                  example: "2005-08-15"
                aadharCard:
                  type: string
                  example: "123412341234"
                address:
                  type: string
                  example: "123 ABC Nagar, Indore"
                village:
                  type: string
                  example: "Harda"
                track:
                  type: string
                  example: "Science"
                stream:
                  type: string
                  example: "Science"
                course:
                  type: string
                  example: "BCA"
                category:
                  type: string
                  example: "General"
                subject12:
                  type: string
                  example: "PCM"
                year12:
                  type: string
                  example: "2023"
                percent12:
                  type: string
                  example: "85%"
                percent10:
                  type: string
                  example: "90%"
                subDepartmentId:
                  type: string
                  example: "64fdb61e7b9a1a1234567891"
                isFTP:
                  type: boolean
                  example: false
      responses:
        '201':
          description: Student created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Student created successfully"
                  data:
                    $ref: '#/components/schemas/NewStudent'
                  meta:
                    type: object
                    description: Auto-resolved values used during creation
                    properties:
                      sessionName:
                        type: string
                        example: "2025-26"
                      levelName:
                        type: string
                        example: "Level 1"
                      subLevelName:
                        type: string
                        example: "SubLevel 1A"
                      syllabusVersion:
                        type: string
                        example: "v1"
                      tasksAssigned:
                        type: integer
                        description: Number of tasks auto-assigned to the student from the syllabus
                        example: 12
        '404':
          description: SubDepartment / Level / SubLevel / Session / SyllabusVersion not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "No active syllabus version found for this session/level/sublevel"
        '409':
          description: Student with this prkey already exists
        '500':
          description: Server error

    get:
      summary: Get all students with optional filters
      description: |
        All query parameters are **optional**. Use any combination:
        - No params → returns all students (for super admin / admin)
        - `departmentId` only → all students across all subDepartments of that department
        - `subDepartmentId` only → all students in that subDepartment
        - `currentLevelId` only → all students at that level
        - `currentSubLevelId` only → all students at that sublevel
        - `sessionId` only → all students of that session
        - `status` only → filter by student status
        - Any combination of the above works together

        Note: If both `departmentId` and `subDepartmentId` are provided, `subDepartmentId` takes priority.
      tags:
        - Student
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: query
          required: false
          schema:
            type: string
          description: Filter by department (returns students from all subDepartments under it)
          example: "64fdb61e7b9a1a1234567890"
        - name: subDepartmentId
          in: query
          required: false
          schema:
            type: string
          description: Filter by specific subDepartment
          example: "64fdb61e7b9a1a1234567891"
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
          description: Filter by session
          example: "64fdb61e7b9a1a1234567894"
        - name: currentLevelId
          in: query
          required: false
          schema:
            type: string
          description: Filter by current level
          example: "64fdb61e7b9a1a1234567892"
        - name: currentSubLevelId
          in: query
          required: false
          schema:
            type: string
          description: Filter by current sub-level
          example: "64fdb61e7b9a1a1234567893"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Active, Completed, Dropped, Placed]
          description: Filter by student status
      responses:
        '200':
          description: List of students matching the filters (or all students if no filter given)
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 25
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NewStudent'
        '500':
          description: Server error

