  /api/admission/students/webhook/register:
    post:
      summary: Add or update student admission data
      tags:
        - Admission Process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prkey
                - firstName
                - lastName
                - fatherName
                - studentMobile
                - parentMobile
                - gender
                - dob
                - aadharCard
                - address
                - stream
                - course
                - category
                - subject12
                - year12
                - percent12
                - percent10
              properties:
                prkey:
                  type: string
                  example: "SS123456"
                firstName:
                  type: string
                  example: "Rahul"
                lastName:
                  type: string
                  example: "Sharma"
                fatherName:
                  type: string
                  example: "Mahesh Sharma"
                studentMobile:
                  type: string
                  pattern: "^[0-9]{10}$"
                  example: "9876543210"
                parentMobile:
                  type: string
                  pattern: "^[0-9]{10}$"
                  example: "9876543211"
                gender:
                  type: string
                  enum: [Male, Female, Other]
                  example: "Male"
                dob:
                  type: string
                  format: date
                  example: "2005-08-15"
                aadharCard:
                  type: string
                  pattern: "^[0-9]{12}$"
                  example: "123412341234"
                address:
                  type: string
                  example: "123, ABC Nagar, Indore"
                track:
                  type: string
                  example: "harda"
                email:
                  type: string
                  format: email
                  example: "ssism.org"
                village:
                  type: string
                  example: "Harda"
                stream:
                  type: string
                  example: "Science"
                course:
                  type: string
                  example: "B.Sc"
                category:
                  type: string
                  example: "General"
                subject12:
                  type: string
                  example: "PCM"
                year12:
                  type: string
                  example: "2022"
                percent12:
                  type: string
                  example: "85%"
                percent10:
                  type: string
                  example: "90%"
      responses:
        '201':
          description: Student admission initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Student admission initiated
                  data:
                    $ref: '#/components/schemas/Admission'
        '200':
          description: Student already registered, data updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Student already registered
                  data:
                    $ref: '#/components/schemas/Admission'
        '400':
          description: Missing or invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Missing field: firstName
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Error adding admission
                  error:
                    type: string


  /api/admission/students/create_interview/{id}:
    post:
      tags:
        - Admission Process
      summary: Add an interview round for a student
      description: Adds a new interview attempt for a given admission ID, enforcing interview rules like round order and maximum failed attempts.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the student in the admission process
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - round
              properties:
                round:
                  type: string
                  description: Interview round name (e.g., First, Second)
                  example: "First"
                assignment:
                  type: string
                  description: Assignment details for the interview
                  example: "Assignment details here"
                communication:
                  type: number
                  description: Communication score
                  example: 7
                confidence:
                  type: number
                  description: Confidence level of the candidate
                  example: 5
                goal:
                  type: number
                  description: Goal clarity score
                  example: 3
                subjectKnowlage:
                  type: number
                  description: Subject knowledge score
                  example: 5
                assignmentMarks:
                  type: number
                  description: Assignment marks
                  example: 5
                sincerity:
                  type: number
