
openapi: 3.0.0
info:
  title: ITEG Management API
  version: 1.0.0
  description: API for managing users like admin, superadmin, and faculty.

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Department:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567890"
        name:
          type: string
          example: "ITEG"
        code:
          type: string
          example: "ITEG001"
        universityName:
          type: string
          example: "SSISM"
        allowedCourses:
          type: array
          items:
            type: object
            properties:
              courseName:
                type: string
                example: "BCA"
              durationInYears:
                type: number
                example: 3
        reportConfig:
          type: object
          properties:
            templateType:
              type: string
              enum: ["ITEG_STANDARD", "MEG_WEIGHTED", "BEG_CUTOFF", "BTECH_STAGE"]
              example: "ITEG_STANDARD"
            sections:
              type: object
              properties:
                showTechnicalSkills:
                  type: boolean
                  example: true
                showSoftSkills:
                  type: boolean
                  example: true
                showDiscipline:
                  type: boolean
                  example: true
                showProjects:
                  type: boolean
                  example: true
                showCareerReadiness:
                  type: boolean
                  example: true
                showUniversityAcademicHistory:
                  type: boolean
                  example: true
                showTaskCompletionPercentage:
                  type: boolean
                  example: true
                showEvaluationBreakdown:
                  type: boolean
                  example: true
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Level:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567892"
        name:
          type: string
          example: "Level 1"
        order:
          type: number
          example: 1
        subDepartmentId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567891"
            - $ref: '#/components/schemas/SubDepartment'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubLevel:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567893"
        name:
          type: string
          example: "SubLevel 1A"
        order:
          type: number
          example: 1
        levelId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567892"
            - $ref: '#/components/schemas/Level'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567894"
        name:
          type: string
          example: "2023-24"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Company:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567890"
        companyName:
          type: string
          example: "TCS Pvt Ltd"
        location:
          type: string
          example: "Bangalore, India"
        companyLogo:
          type: string
          example: "https://cloudinary.com/logo.png"
        hrEmail:
          type: string
          format: email
          example: "hr@tcs.com"
        hrContact:
          type: string
          example: "+91-9876543210"
        headOffice:
          type: string
          example: "Mumbai, India"
    
    PlacedStudent:
      type: object
      properties:
        _id:
          type: string
          example: "64a1b2c3d4e5f6789012345"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        course:
          type: string
          example: "B.Tech CSE"
        placedInfo:
          type: object
          properties:
            salary:
              type: number
              example: 500000
            jobProfile:
              type: string
              example: "Software Developer"
            location:
              type: string
              example: "Bangalore, India"

    User:
      type: object
      properties:
        _id:
          type: string
          example: "662b18b6c3eabc00123f5678"
        profileImage:
          type: string
          example: "https://example.com/profile.jpg"
        position:
          type: string
          example: "Developer"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "johndoe@example.com"
        mobileNo:
          type: string
          example: "9876543210"
        adharCard:
          type: string
          example: "123456789012"
        password:
          type: string
          example: "$2b$10$somethinghashed"   # Password will be hashed
        role:
          type: string
          example: "admin"
        department:
          type: string
          example: "IT"
        refreshToken:
          type: string
          example: "some-refresh-token"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-04-29T08:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-04-29T08:30:00.000Z"
    
    SubDepartment:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567891"
        name:
          type: string
          example: "Computer Applications"
        departmentId:
          oneOf:
            - type: string
              example: "64fdb61e7b9a1a1234567890"
            - $ref: '#/components/schemas/Department'
        allowedCourses:
          type: array
          items:
            type: string
          example: ["BCA", "MCA"]
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    StudentReportCard:
      type: object
      required:
        - studentRef
        - batchYear
        - generatedByName
      properties:
        studentRef:
          type: string
          description: Reference to AdmittedStudent
          example: "671ff96e0b213a12bca4d1b5"
        batchYear:
          type: string
          description: Batch year
          example: "2025"
        generatedByName:
          type: string
          description: Name of the user who generated the report
          example: "John Doe"
        technicalSkills:
          type: array
          items:
            type: object
            properties:
              skillName:
                type: string
                example: "React"
              theoryMarks:
                type: number
                example: 80
              practicalMarks:
                type: number
                example: 90
              totalPercentage:
                type: number
                example: 85
              remark:
                type: string
                example: "Good"
        softSkills:
          type: object
          properties:
            sectionTitle:
              type: string
              example: "Soft Skills Evaluation (50 Marks)"
            categories:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                    example: "Presentation Skills"
                  maxMarks:
                    type: number
                    example: 10
                  subcategories:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: "Content & Structure"
                        value:
                          type: boolean
                          example: true
                  score:
                    type: number
                    example: 8
            totalSoftSkillMarks:
              type: number
              example: 40
        discipline:
          type: object
          properties:
            sectionTitle:
              type: string
              example: "Discipline Evaluation (30 Marks)"
            categories:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                    example: "Attendance"
                  maxMarks:
                    type: number
                    example: 10
                  subcategories:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: "Punctuality"
                        value:
                          type: boolean
                          example: true
                  score:
                    type: number
                    example: 8
            totalDisciplineMarks:
              type: number
              example: 25
    Admission:
      type: object
      required:
        - prkey
        - firstName
        - lastName
        - fatherName
        - studentMobile
        - parentMobile
        - gender
        - dob
        - aadharCard
        - address
        - stream
        - course
        - category
        - subject12
        - year12
        - percent12
        - percent10
      properties:
        prkey:
          type: string
          example: PR123456
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        fatherName:
          type: string
          example: Richard Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        studentMobile:
          type: string
          example: "9876543210"
        parentMobile:
          type: string
          example: "9123456780"
        gender:
          type: string
          example: Male
        dob:
          type: string
          format: date
          example: 2000-01-01
        aadharCard:
          type: string
          example: "123456789012"
        address:
          type: string
          example: "123 Main St, City, State"
        stream:
          type: string
          example: Science
        course:
          type: string
          example: B.Sc
        category:
          type: string
          example: General
        subject12:
          type: string
          example: Physics
        year12:
          type: string
          example: "2018"
        percent12:
          type: string
          example: "85%"
        percent10:
          type: string
          example: "85%"
        itegInterviewFlag:
          type: boolean
          example: false
        admissionStatus:
          type: boolean
          example: false
        admissionDate:
          type: string
          format: date
          example: 2025-04-25
        interviewStage:
          type: string
          enum:
            - Registered
            - Test Scheduled
            - Test not Attempted
            - Test Completed
            - First Interview Scheduled
            - First Interview Passed
            - Second Interview Scheduled
            - Second Interview Passed
            - ITEG Interview Completed
          example: Registered
        onlineTest:
          type: object
          properties:
            date:
              type: string
              format: date
              example: 2025-04-20
            testLink:
              type: string
              example: http://example.com/test
            result:
              type: string
              enum: [Pass, Fail, Pending, Not Attempted]
              example: Pending
        interviews:
          type: array
          items:
            type: object
            properties:
              round:
                type: string
                enum: [First, Second]
                example: First
              assignment:
                type: string
                example: "Assignment details here"
              attemptNo:
                type: integer
                example: 1
              communication:
                type: number
                example: 5
              confidence:
                type: number
                example: 4
              goal:
                type: number
                example: 3
              subjectKnowlage:
                type: number
                example: 4
              assignmentMarks:
                type: number
                example: 4
              sincerity:
                type: number
                example: 4
              maths:
                type: number
                example: 4
              reasoning:
                type: number
                example: 4
              created_by:
                type: string
                example: "faculty"
              marks:
                type: number
                example: 85
              remark:
                type: string
                example: Good performance
              date:
                type: string
                format: date
                example: 2025-04-22
              result:
                type: string
                enum: [Pass, Fail, Pending]
                example: Pass
        scheduledInterview:
          type: object
          properties:
            date:
              type: string
              format: date
              example: 2025-04-25
            round:
              type: string
              enum: [First, Second]
              example: First
            isScheduled:
              type: boolean
              example: true
    AdmissionLevel:
      type: object
      properties:
        levelNo:
          type: string
          example: "1"
        noOfAttempts:
          type: integer
          default: 0
        Topic:
          type: string
          example: "Java"
        marks:
          type: number
          default: 0
        remark:
          type: string
        date:
          type: string
          format: date
        result:
          type: string
          enum: [Pass, Fail, Pending]
          default: Pending

    PlacedInfo:
      type: object
      properties:
        companyName:
          type: string
        salary:
          type: number
        location:
          type: string

    InterviewRecord:
      type: object
      properties:
        companyName:
          type: string
        interviewDate:
          type: string
          format: date
        remark:
          type: string
        result:
          type: string
          enum: [Selected, Rejected, Pending]
          default: Pending
        location:
          type: string
        jobProfile:
          type: string

    AdmittedStudent:
      type: object
      required:
        - admissionRef
        - fullName
        - prkey
        - stream
        - course
        - fatherName
        - mobileNo
        - address
        - track
        - village
      properties:
        admissionRef:
          type: string
          format: uuid
        fullName:
          type: string
        prkey:
          type: string
        stream:
          type: string
        course:
          type: string
        fatherName:
          type: string
        mobileNo:
          type: string
        email:
          type: string
        address:
          type: string
        track:
          type: string
        village:
          type: string
        level:
          type: array
          items:
            $ref: '#/components/schemas/AdmissionLevel'
        techno:
          type: string
        attendancePercentage:
          type: number
          minimum: 0
          maximum: 100
        placedInfo:
          $ref: '#/components/schemas/PlacedInfo'
        permissionRequired:
          type: boolean
          default: false
        interviewRecord:
          type: array
          items:
            $ref: '#/components/schemas/InterviewRecord'
        readinessStatus:
          type: string
          enum: [Ready, Not Ready]
          default: Not Ready
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NewStudent:
      type: object
      properties:
        _id:
          type: string
          example: "64fdb61e7b9a1a1234567890"
        prkey:
          type: string
          example: "SS2025001"
        image:
          type: string
          example: "https://res.cloudinary.com/example/image/upload/student.jpg"
        firstName:
          type: string
          example: "Rahul"
        lastName:
          type: string
          example: "Sharma"
        fatherName:
          type: string
          example: "Mahesh Sharma"
        email:
          type: string
          example: "rahul@example.com"
        studentMobile:
          type: string
          example: "9876543210"
        parentMobile:
          type: string
          example: "9876543211"
        gender:
          type: string
          example: "Male"
        dob:
          type: string
          format: date
          example: "2005-08-15"
        address:
          type: string
          example: "123 ABC Nagar, Indore"
        village:
          type: string
          example: "Harda"
        course:
          type: string
          example: "BCA"
        subDepartmentId:
          type: string
          example: "64fdb61e7b9a1a1234567891"
        sessionId:
          type: string
          example: "64fdb61e7b9a1a1234567894"
        syllabusVersionId:
          type: string
          example: "64fdb61e7b9a1a1234567895"
        currentLevelId:
          type: string
          example: "64fdb61e7b9a1a1234567892"
        currentSubLevelId:
          type: string
          example: "64fdb61e7b9a1a1234567893"
        status:
          type: string
          enum: [Active, Completed, Dropped, Placed]
          example: "Active"
        isFTP:
          type: boolean
          example: false
        documents:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              title:
                type: string
                example: "Aadhar Card"
              fileURL:
                type: string
                example: "https://res.cloudinary.com/example/raw/upload/doc.pdf"
              fileType:
                type: string
                enum: [image, pdf]
              uploadedByName:
                type: string
              uploadedAt:
                type: string
                format: date-time
        permissionDetails:
          type: object
          nullable: true
          properties:
            imageURL:
              type: string
            remark:
              type: string
            approved_by:
              type: string
            uploadDate:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  # ===== DEPARTMENT APIs =====
  /api/departments:
    post:
      summary: Create a new department
      tags:
        - Department
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - code
                - universityName
                - reportConfig
              properties:
                name:
                  type: string
                  example: "ITEG"
                code:
                  type: string
                  example: "ITEG001"
                universityName:
                  type: string
                  example: "SSISM"
                allowedCourses:
                  type: array
                  items:
                    type: object
                    properties:
                      courseName:
                        type: string
                        example: "BCA"
                      durationInYears:
                        type: number
                        example: 3
                reportConfig:
                  type: object
                  required:
                    - templateType
                    - sections
                  properties:
                    templateType:
                      type: string
                      enum: ["ITEG_STANDARD", "MEG_WEIGHTED", "BEG_CUTOFF", "BTECH_STAGE"]
                      example: "ITEG_STANDARD"
                    sections:
                      type: object
                      properties:
                        showTechnicalSkills:
                          type: boolean
                          example: true
                        showSoftSkills:
                          type: boolean
                          example: true
                        showDiscipline:
                          type: boolean
                          example: true
                        showProjects:
                          type: boolean
                          example: true
                        showCareerReadiness:
                          type: boolean
                          example: true
                        showUniversityAcademicHistory:
                          type: boolean
                          example: true
                        showTaskCompletionPercentage:
                          type: boolean
                          example: true
                        showEvaluationBreakdown:
                          type: boolean
                          example: true
      responses:
        '201':
          description: Department created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Department created successfully"
                  data:
                    $ref: '#/components/schemas/Department'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid reportConfig structure. Must include templateType and sections."
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Access denied. No token provided."
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Access denied. Insufficient permissions."
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Internal server error"

    get:
      summary: Get all departments
      tags:
        - Department
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of departments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
        '500':
          description: Server error

  /api/departments/{id}:
    get:
      summary: Get department by ID
      tags:
        - Department
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "64fdb61e7b9a1a1234567890"
      responses:
        '200':
          description: Department found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Department'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid department ID format"
        '404':
          description: Department not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Department not found"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Internal server error"

    put:
      summary: Update department
      tags:
        - Department
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated ITEG"
                universityName:
                  type: string
                  example: "SSISM Updated"
      responses:
        '200':
          description: Department updated successfully
        '404':
          description: Department not found
        '500':
          description: Server error

    delete:
      summary: Delete department (soft delete)
      tags:
        - Department
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Department deleted successfully
        '404':
          description: Department not found
        '500':
          description: Server error

  # ===== SUBDEPARTMENT APIs =====
  /api/subdepartments:
    post:
      summary: Create a new subdepartment
      tags:
        - SubDepartment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - departmentId
              properties:
                name:
                  type: string
                  example: "Computer Applications"
                departmentId:
                  type: string
                  example: "64fdb61e7b9a1a1234567890"
                allowedCourses:
                  type: array
                  items:
                    type: string
                  example: ["BCA", "MCA"]
      responses:
        '201':
          description: SubDepartment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "SubDepartment created successfully"
                  data:
                    $ref: '#/components/schemas/SubDepartment'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Name and departmentId are required"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Access denied. No token provided."
        '404':
          description: Department not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Department not found"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
