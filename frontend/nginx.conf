server {
    listen 80;
    server_name sp-central.ssism.org www.sp-central.ssism.org localhost _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Maximum upload size for photos, resumes, and reports
    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint for AWS ALB / Docker
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Static assets caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # NOTE: No same-origin /api proxy here. The frontend calls the backend
    # directly via VITE_API_URL (https://sp-central-api.ssism.org/api), and the
    # host nginx handles that domain. A literal "proxy_pass http://backend:5000"
    # would crash nginx on startup when the container runs standalone (no
    # compose network to resolve the "backend" hostname).

    # SPA routing: fallback all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
